<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Agricultural Forest -->
    <linearGradient id="mc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082315" />
      <stop offset="50%" stop-color="#0D3520" />
      <stop offset="100%" stop-color="#154B2F" />
    </linearGradient>

    <!-- Left Leaf Wing: Emerald Vitality (Farmer / Supply) -->
    <linearGradient id="mc-leaf-l" x1="0%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Right Leaf Wing: Fresh Mint & Jade (Market / Delivery) -->
    <linearGradient id="mc-leaf-r" x1="20%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Center Sprout & Sun: Harvest Gold / Saffron (Prosperity & Connect) -->
    <linearGradient id="mc-sun" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>

    <!-- Bridge Arc Gradient -->
    <linearGradient id="mc-arc-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- Ambient Glow Filter -->
    <filter id="mc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Soft Depth Shadow -->
    <filter id="mc-shadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#02120A" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- iOS/PWA Squircle Outer Badge -->
  <rect x="28" y="28" width="456" height="456" rx="104" fill="url(#mc-bg)" stroke="rgba(255,255,255,0.14)" stroke-width="2.5" />

  <!-- Subtle Interior Ambient Lighting -->
  <circle cx="256" cy="190" r="140" fill="#10B981" opacity="0.12" filter="url(#mc-glow)" />
  <circle cx="256" cy="140" r="75" fill="#F59E0B" opacity="0.18" filter="url(#mc-glow)" />

  <!-- Main Symbol Mark -->
  <g filter="url(#mc-shadow)">
    <!-- Connecting Wholesale Highway Arc (Base Bridge) -->
    <path d="M 148 368 C 205 408 307 408 364 368" fill="none" stroke="url(#mc-arc-grad)" stroke-width="7" stroke-linecap="round" opacity="0.9" />

    <!-- Left Wing of 'M' (Sweeping Agricultural Leaf) -->
    <path d="M 148 365 C 130 295 125 210 168 152 C 192 120 226 138 238 172 C 252 210 250 262 254 300 C 224 286 194 256 182 218 C 166 262 168 316 182 355 C 170 360 158 363 148 365 Z"
          fill="url(#mc-leaf-l)" />

    <!-- Right Wing of 'M' (Dynamic Wholesale Leaf) -->
    <path d="M 364 365 C 382 295 387 210 344 152 C 320 120 286 138 274 172 C 260 210 262 262 258 300 C 288 286 318 256 330 218 C 346 262 344 316 330 355 C 342 360 354 363 364 365 Z"
          fill="url(#mc-leaf-r)" />

    <!-- Central Sprout Heart (Direct Growth & Trust) -->
    <path d="M 256 316 C 240 274 242 225 256 182 C 270 225 272 274 256 316 Z"
          fill="url(#mc-sun)" />

    <!-- The Harvest Sun & Digital Connection Node (Apex) -->
    <g transform="translate(256, 136)">
      <!-- Outer Connection Signal Ring -->
      <circle cx="0" cy="0" r="30" fill="none" stroke="#FDE047" stroke-width="3" opacity="0.45" stroke-dasharray="8 6" />
      <!-- Radiant Harvest Core -->
      <circle cx="0" cy="0" r="20" fill="url(#mc-sun)" filter="url(#mc-glow)" />
      <circle cx="0" cy="0" r="9" fill="#FFFFFF" opacity="0.95" />
    </g>

    <!-- Farmer Supply Node (Left) -->
    <g transform="translate(148, 365)">
      <circle cx="0" cy="0" r="11" fill="#10B981" stroke="#FFFFFF" stroke-width="3" />
      <circle cx="0" cy="0" r="4" fill="#082315" />
    </g>

    <!-- Commercial Buyer Node (Right) -->
    <g transform="translate(364, 365)">
      <circle cx="0" cy="0" r="11" fill="#F59E0B" stroke="#FFFFFF" stroke-width="3" />
      <circle cx="0" cy="0" r="4" fill="#082315" />
    </g>

    <!-- Central APMC Hub Node (Bottom Center) -->
    <g transform="translate(256, 396)">
      <circle cx="0" cy="0" r="8.5" fill="#FDE047" stroke="#082315" stroke-width="2.5" />
      <circle cx="0" cy="0" r="3" fill="#082315" />
    </g>
  </g>
</svg>

