<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082315" />
      <stop offset="100%" stop-color="#144C2E" />
    </linearGradient>
    <linearGradient id="fav-leaf-l" x1="0%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#4ADE80" />
    </linearGradient>
    <linearGradient id="fav-leaf-r" x1="20%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="fav-gold" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>
  </defs>

  <!-- High-contrast rounded squircle background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#fav-bg)" stroke="#10B981" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Connecting Base Highway Arc -->
  <path d="M 17 48 C 25 54 39 54 47 48" fill="none" stroke="url(#fav-gold)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Left Wing Leaf ('M') -->
  <path d="M 17 47 C 14 38 14 26 21 19 C 24 15 28 17 30 21 C 31.5 25 31.5 32 32 38 C 28 36 24 32 22 27 C 20 33 20 40 22 46 Z"
        fill="url(#fav-leaf-l)" />

  <!-- Right Wing Leaf ('M') -->
  <path d="M 47 47 C 50 38 50 26 43 19 C 40 15 36 17 34 21 C 32.5 25 32.5 32 32 38 C 36 36 40 32 42 27 C 44 33 44 40 42 46 Z"
        fill="url(#fav-leaf-r)" />

  <!-- Golden Sprout Center -->
  <path d="M 32 40 C 30 35 30 29 32 23 C 34 29 34 35 32 40 Z"
        fill="url(#fav-gold)" />

  <!-- Glowing Sun / Connect Node -->
  <circle cx="32" cy="17" r="4.5" fill="url(#fav-gold)" stroke="#FFFFFF" stroke-width="1.2" />

  <!-- Side Wholesale Nodes -->
  <circle cx="17" cy="47" r="2.2" fill="#4ADE80" />
  <circle cx="47" cy="47" r="2.2" fill="#F59E0B" />
</svg>
