<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Left Leaf Wing: Emerald Vitality -->
    <linearGradient id="mark-leaf-l" x1="0%" y1="100%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Right Leaf Wing: Fresh Mint & Jade -->
    <linearGradient id="mark-leaf-r" x1="20%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Center Sprout & Sun: Harvest Gold -->
    <linearGradient id="mark-sun" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FDE047" />
    </linearGradient>

    <!-- Bridge Arc Gradient -->
    <linearGradient id="mark-arc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <filter id="mark-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Connecting Wholesale Highway Arc -->
  <path d="M 148 368 C 205 408 307 408 364 368" fill="none" stroke="url(#mark-arc)" stroke-width="8" stroke-linecap="round" />

  <!-- Left Wing of 'M' (Sweeping Agricultural Leaf) -->
  <path d="M 148 365 C 130 295 125 210 168 152 C 192 120 226 138 238 172 C 252 210 250 262 254 300 C 224 286 194 256 182 218 C 166 262 168 316 182 355 C 170 360 158 363 148 365 Z"
        fill="url(#mark-leaf-l)" />

  <!-- Right Wing of 'M' (Dynamic Wholesale Leaf) -->
  <path d="M 364 365 C 382 295 387 210 344 152 C 320 120 286 138 274 172 C 260 210 262 262 258 300 C 288 286 318 256 330 218 C 346 262 344 316 330 355 C 342 360 354 363 364 365 Z"
        fill="url(#mark-leaf-r)" />

  <!-- Central Sprout Heart -->
  <path d="M 256 316 C 240 274 242 225 256 182 C 270 225 272 274 256 316 Z"
        fill="url(#mark-sun)" />

  <!-- The Harvest Sun & Digital Connection Node (Apex) -->
  <g transform="translate(256, 136)">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#FDE047" stroke-width="3" opacity="0.6" stroke-dasharray="8 6" />
    <circle cx="0" cy="0" r="21" fill="url(#mark-sun)" filter="url(#mark-glow)" />
    <circle cx="0" cy="0" r="9" fill="#FFFFFF" opacity="0.95" />
  </g>

  <!-- Farmer Supply Node (Left) -->
  <g transform="translate(148, 365)">
    <circle cx="0" cy="0" r="12" fill="#10B981" stroke="#0D2818" stroke-width="3" />
    <circle cx="0" cy="0" r="4.5" fill="#FFFFFF" />
  </g>

  <!-- Commercial Buyer Node (Right) -->
  <g transform="translate(364, 365)">
    <circle cx="0" cy="0" r="12" fill="#F59E0B" stroke="#0D2818" stroke-width="3" />
    <circle cx="0" cy="0" r="4.5" fill="#FFFFFF" />
  </g>

  <!-- Central Base Node (Bottom) -->
  <g transform="translate(256, 396)">
    <circle cx="0" cy="0" r="9.5" fill="#FDE047" stroke="#0D2818" stroke-width="3" />
  </g>
</svg>

